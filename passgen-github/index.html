<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PassGen — Générateur de mots de passe</title>

  <!-- Syne : géométrique, moderne, caractère fort pour les titres -->
  <!-- Syne Mono : version monospace pour afficher le mot de passe -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Syne+Mono&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════
       EN-TÊTE
  ════════════════════════════════════════════ -->
  <header class="site-header">
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        <circle cx="12" cy="16" r="1" fill="currentColor"/>
      </svg>
      <span>PassGen</span>
    </div>

    <!-- Bouton mode clair / sombre -->
    <button class="theme-toggle" id="theme-toggle" aria-label="Changer le thème" title="Mode sombre / clair">
      <span class="theme-icon-light">☀️</span>
      <span class="theme-icon-dark">🌙</span>
    </button>
  </header>

  <!-- ═══════════════════════════════════════════
       CONTENU PRINCIPAL
  ════════════════════════════════════════════ -->
  <main class="main">

    <!-- Bloc titre -->
    <div class="hero">
      <h1 class="hero-title">Générateur de<br><em>mot de passe</em></h1>
      <p class="hero-sub">Sécurisé, personnalisable, instantané.</p>
    </div>

    <!-- ─── CARTE PRINCIPALE ─────────────────── -->
    <div class="card" id="main-card">

      <!-- Zone affichage mot de passe -->
      <div class="password-zone" id="password-zone">

        <div class="password-label">
          <span class="label-text">Votre mot de passe</span>

          <!-- Bouton afficher / masquer -->
          <button class="icon-btn" id="btn-toggle" title="Afficher / Masquer" aria-label="Afficher ou masquer le mot de passe">
            <!-- Icône œil ouvert -->
            <svg id="icon-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <!-- Icône œil barré (caché par défaut) -->
            <svg id="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>

        <!-- Ligne affichage + boutons d'action -->
        <div class="password-row">
          <!-- Le mot de passe s'affiche ici -->
          <span class="password-text" id="password-output" aria-live="polite">
            Cliquez sur Générer…
          </span>

          <div class="password-actions">
            <!-- Bouton copier -->
            <button class="action-btn" id="btn-copy" title="Copier" aria-label="Copier le mot de passe" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span class="copy-feedback" id="copy-feedback">Copié !</span>
            </button>

            <!-- Bouton régénérer -->
            <button class="action-btn" id="btn-regen" title="Régénérer" aria-label="Régénérer un mot de passe">
              <svg id="regen-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            </button>
          </div>
        </div>

        <!-- Longueur affichée sous le mot de passe -->
        <div class="password-meta" id="password-meta"></div>
      </div>

      <!-- ─── INDICATEUR DE FORCE ─────────────── -->
      <div class="strength-section">
        <!-- 4 blocs colorés -->
        <div class="strength-bars">
          <div class="s-bar" id="s1"></div>
          <div class="s-bar" id="s2"></div>
          <div class="s-bar" id="s3"></div>
          <div class="s-bar" id="s4"></div>
        </div>
        <span class="strength-label" id="strength-label">—</span>
      </div>

      <!-- ─── CONTRÔLES ──────────────────────── -->
      <div class="controls">

        <!-- Longueur -->
        <div class="control-group">
          <div class="control-header">
            <label class="control-label" for="length-slider">Longueur</label>
            <span class="length-badge" id="length-value">16</span>
          </div>
          <input type="range" id="length-slider" class="slider" min="4" max="64" value="16" aria-label="Longueur du mot de passe" />
          <div class="slider-marks"><span>4</span><span>32</span><span>64</span></div>
        </div>

        <!-- Options -->
        <div class="control-group">
          <p class="control-label">Caractères inclus</p>
          <div class="options-grid">

            <label class="option" id="opt-label-uppercase">
              <input type="checkbox" id="opt-uppercase" checked />
              <span class="opt-check"></span>
              <span class="opt-body">
                <span class="opt-icon">Aa</span>
                <span class="opt-info">
                  <strong>Majuscules</strong>
                  <em>A–Z</em>
                </span>
              </span>
              <!-- Tooltip d'aide -->
              <button class="tip-btn" data-tip="Lettres capitales. Recommandé pour augmenter la force." aria-label="Aide">?</button>
            </label>

            <label class="option" id="opt-label-lowercase">
              <input type="checkbox" id="opt-lowercase" checked />
              <span class="opt-check"></span>
              <span class="opt-body">
                <span class="opt-icon">aa</span>
                <span class="opt-info">
                  <strong>Minuscules</strong>
                  <em>a–z</em>
                </span>
              </span>
              <button class="tip-btn" data-tip="Lettres en minuscules. Indispensable pour la lisibilité." aria-label="Aide">?</button>
            </label>

            <label class="option" id="opt-label-numbers">
              <input type="checkbox" id="opt-numbers" checked />
              <span class="opt-check"></span>
              <span class="opt-body">
                <span class="opt-icon">09</span>
                <span class="opt-info">
                  <strong>Chiffres</strong>
                  <em>0–9</em>
                </span>
              </span>
              <button class="tip-btn" data-tip="Ajoute des chiffres. Augmente significativement l'entropie." aria-label="Aide">?</button>
            </label>

            <label class="option" id="opt-label-symbols">
              <input type="checkbox" id="opt-symbols" />
              <span class="opt-check"></span>
              <span class="opt-body">
                <span class="opt-icon">!@</span>
                <span class="opt-info">
                  <strong>Symboles</strong>
                  <em>!@#…</em>
                </span>
              </span>
              <button class="tip-btn" data-tip="Caractères spéciaux. Très efficace mais parfois refusés par certains sites." aria-label="Aide">?</button>
            </label>

          </div>
        </div>
      </div>

      <!-- ─── BOUTON GÉNÉRER ─────────────────── -->
      <button class="btn-generate" id="btn-generate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        Générer un mot de passe
      </button>

    </div><!-- fin .card -->

    <!-- ─── HISTORIQUE ─────────────────────────── -->
    <div class="history-card" id="history-card">

      <div class="history-header">
        <h2 class="history-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Historique
          <span class="history-count" id="history-count" hidden>0</span>
        </h2>
        <button class="clear-btn" id="btn-clear" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          Effacer
        </button>
      </div>

      <!-- Liste (remplie par JS) -->
      <ul class="history-list" id="history-list" role="list">
        <li class="history-empty">Aucun mot de passe généré pour l'instant.</li>
      </ul>

    </div>

  </main>

  <!-- Pied de page -->
  <footer class="site-footer">
    <p>Généré avec <code>crypto.getRandomValues()</code> · Projet BTS SIO SLAM · Giovanni BINTOUL</p>
  </footer>

  <!-- Tooltip flottant (positionné par JS) -->
  <div class="tooltip-bubble" id="tooltip-bubble" role="tooltip" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
