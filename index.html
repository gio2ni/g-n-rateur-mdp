<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Mots de Passe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <header class="header">
        <h1>Générateur de Mot de Passe</h1>
        <p class="subtitle">Sécurisé · Personnalisable · Instantané</p>
    </header>

    <main class="card">

        <!-- Affichage du mot de passe -->
        <div class="password-box">
            <input type="password" id="password-output" readonly placeholder="Votre mot de passe...">
            <div class="password-controls">
                <button id="btn-toggle-visibility" class="btn-icon" title="Afficher / Masquer">
                    <svg id="icon-eye-show" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg id="icon-eye-hide" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </button>
                <button id="btn-copy" class="btn-icon" title="Copier">
                    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Indicateur de force -->
        <div class="strength-section">
            <div class="strength-header">
                <span class="strength-label">Force</span>
                <span id="strength-text" class="strength-value">—</span>
            </div>
            <div class="strength-track">
                <div id="strength-bar" class="strength-fill"></div>
            </div>
        </div>

        <!-- Longueur -->
        <div class="option-block">
            <div class="option-header">
                <label class="option-label" for="length-slider">Longueur</label>
                <span class="option-value"><strong id="length-value">16</strong> caractères</span>
            </div>
            <input type="range" id="length-slider" min="4" max="64" value="16" class="slider">
            <div class="slider-marks"><span>4</span><span>64</span></div>
        </div>

        <!-- Types de caractères -->
        <div class="option-block">
            <p class="option-label">Types de caractères</p>
            <div class="checkboxes">
                <label class="checkbox-item"><input type="checkbox" id="use-uppercase" checked><span class="checkbox-box"></span>Majuscules (A–Z)</label>
                <label class="checkbox-item"><input type="checkbox" id="use-lowercase" checked><span class="checkbox-box"></span>Minuscules (a–z)</label>
                <label class="checkbox-item"><input type="checkbox" id="use-numbers"   checked><span class="checkbox-box"></span>Chiffres (0–9)</label>
                <label class="checkbox-item"><input type="checkbox" id="use-symbols"   checked><span class="checkbox-box"></span>Symboles (!@#...)</label>
            </div>
        </div>

        <button id="btn-generate" class="btn-primary">Générer un mot de passe</button>

    </main>

    <!-- Historique -->
    <section class="card">
        <div class="history-header">
            <div class="history-title-group">
                <h2 class="history-title">Historique</h2>
                <span id="history-count" class="history-badge">0 / 10</span>
            </div>
            <button id="btn-clear-history" class="btn-clear">Tout effacer</button>
        </div>
        <div id="history-list" class="history-list">
            <p class="history-empty">Aucun mot de passe généré.</p>
        </div>
    </section>


</div>

<div id="toast" class="toast"></div>
<script src="script.js"></script>
</body>
</html>
