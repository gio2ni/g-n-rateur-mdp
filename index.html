<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Générateur de mot de passe</title>

  <!-- Lien vers la feuille de style externe -->
  <link rel="stylesheet" href="style.css" />

  <!-- Police Google Fonts : "Share Tech Mono" pour un style terminal/code -->
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;500;700&display=swap" rel="stylesheet" />

  <!-- Icônes Remix Icons (CDN gratuit, simple à utiliser) -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
</head>
<body>

  <!-- ==============================
       CONTENEUR PRINCIPAL (carte centrale)
  =============================== -->
  <div class="card">

    <!-- En-tête de l'application -->
    <header class="card__header">
      <div class="header-icon">
        <i class="ri-shield-keyhole-line"></i>
      </div>
      <h1 class="card__title">Générateur de<br><span class="highlight">Mot de Passe</span></h1>
      <p class="card__subtitle">Créez des mots de passe forts et sécurisés</p>
    </header>

    <!-- ==============================
         ZONE D'AFFICHAGE DU MOT DE PASSE
    =============================== -->
    <div class="password-display">
      <!-- Le mot de passe généré s'affiche ici (id utilisé par JS) -->
      <span id="password-output" class="password-text">Cliquez sur Générer</span>

      <!-- Bouton copier avec icône -->
      <button id="btn-copy" class="btn-copy" title="Copier le mot de passe">
        <i class="ri-file-copy-line"></i>
        <!-- Le message "Copié !" s'affiche ici temporairement -->
        <span id="copy-feedback" class="copy-feedback">Copié !</span>
      </button>
    </div>

    <!-- ==============================
         INDICATEUR DE FORCE DU MOT DE PASSE
    =============================== -->
    <div class="strength-wrapper">
      <!-- Barre de progression de la force -->
      <div class="strength-bar">
        <!-- La largeur et la couleur de cette barre sont modifiées par JS -->
        <div id="strength-fill" class="strength-fill"></div>
      </div>
      <!-- Texte indiquant le niveau : Faible / Moyen / Fort / Très fort -->
      <span id="strength-label" class="strength-label">—</span>
    </div>

    <!-- ==============================
         CONTRÔLES DE CONFIGURATION
    =============================== -->
    <div class="controls">

      <!-- === LONGUEUR DU MOT DE PASSE === -->
      <div class="control-group">
        <label class="control-label">
          <i class="ri-ruler-line"></i>
          Longueur
          <!-- Affiche la valeur actuelle du slider (mis à jour par JS) -->
          <span id="length-value" class="length-badge">16</span>
        </label>
        <!-- Slider : min=4, max=64, valeur par défaut=16 -->
        <input
          type="range"
          id="length-slider"
          class="slider"
          min="4"
          max="64"
          value="16"
        />
        <!-- Indications visuelles sous le slider -->
        <div class="slider-labels">
          <span>4</span>
          <span>64</span>
        </div>
      </div>

      <!-- === OPTIONS (CASES À COCHER) === -->
      <div class="control-group">
        <label class="control-label">
          <i class="ri-settings-3-line"></i>
          Options
        </label>

        <div class="options-grid">

          <!-- Chaque option a : une case à cocher + une icône + un libellé + un exemple -->
          <label class="option-item">
            <input type="checkbox" id="opt-uppercase" checked />
            <span class="option-box">
              <i class="ri-font-size-2"></i>
              <span class="option-text">
                <strong>Majuscules</strong>
                <em>A–Z</em>
              </span>
            </span>
          </label>

          <label class="option-item">
            <input type="checkbox" id="opt-lowercase" checked />
            <span class="option-box">
              <i class="ri-font-size"></i>
              <span class="option-text">
                <strong>Minuscules</strong>
                <em>a–z</em>
              </span>
            </span>
          </label>

          <label class="option-item">
            <input type="checkbox" id="opt-numbers" checked />
            <span class="option-box">
              <i class="ri-hashtag"></i>
              <span class="option-text">
                <strong>Chiffres</strong>
                <em>0–9</em>
              </span>
            </span>
          </label>

          <label class="option-item">
            <input type="checkbox" id="opt-symbols" />
            <span class="option-box">
              <i class="ri-asterisk"></i>
              <span class="option-text">
                <strong>Symboles</strong>
                <em>!@#$…</em>
              </span>
            </span>
          </label>

        </div>
      </div>

    </div><!-- fin .controls -->

    <!-- ==============================
         BOUTON GÉNÉRER
    =============================== -->
    <button id="btn-generate" class="btn-generate">
      <i class="ri-refresh-line btn-icon"></i>
      Générer un mot de passe
    </button>

  </div><!-- fin .card -->

  <!-- Fond animé (particules décoratives) -->
  <canvas id="bg-canvas"></canvas>

  <!-- Lien vers le script JavaScript externe -->
  <script src="script.js"></script>
</body>
</html>
